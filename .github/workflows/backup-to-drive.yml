name: Backup para o Google Drive

# Roda toda vez que houver push na branch principal, em qualquer arquivo do repositório.
on:
  push:
    branches:
      - main

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar rclone
        run: sudo apt-get update && sudo apt-get install -y rclone

      - name: Configurar acesso ao Google Drive
        run: |
          mkdir -p ~/.config/rclone
          echo '${{ secrets.RCLONE_CONFIG }}' > ~/.config/rclone/rclone.conf

      - name: Enviar arquivos para o Google Drive
        run: |
          rclone copy . "gdrive:LBE-Backups" \
            --exclude ".git/**" \
            --progress

      - name: Confirmar backup concluído
        run: echo "Backup enviado com sucesso para o Google Drive."
